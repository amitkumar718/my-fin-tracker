      <g transform="translate(10,10)"><rect width="24" height="12" rx="6" fill="#26A69A"/><text x="12" y="9" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">SMS</text></g>
      <text x="40" y="19" font-size="13" font-weight="700" fill="#212121">Satheesh (UPI)</text>
      <text x="10" y="33" font-size="10" fill="#616161">Today · 09:42 · HDFC</text>
      <text x="326" y="19" font-size="13" font-weight="700" fill="#212121" text-anchor="end">₹3,000.00</text>

      <g transform="translate(0,40)">
        <rect width="336" height="38" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
        <g transform="translate(10,10)"><rect width="24" height="12" rx="6" fill="#26A69A"/><text x="12" y="9" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">SMS</text></g>
        <text x="40" y="19" font-size="13" font-weight="700" fill="#212121">Zomato</text>
        <text x="10" y="33" font-size="10" fill="#616161">Yesterday · Axis Credit</text>
        <text x="326" y="19" font-size="13" font-weight="700" fill="#212121" text-anchor="end">₹524.00</text>
      </g>
      <g transform="translate(0,80)">
        <rect width="336" height="38" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
        <g transform="translate(10,10)"><rect width="24" height="12" rx="6" fill="#26A69A"/><text x="12" y="9" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">SMS</text></g>
        <text x="40" y="19" font-size="13" font-weight="700" fill="#212121">BESCOM Electricity</text>
        <text x="10" y="33" font-size="10" fill="#616161">20 Oct · HDFC</text>
        <text x="326" y="19" font-size="13" font-weight="700" fill="#212121" text-anchor="end">₹2,210.00</text>
      </g>
      <g transform="translate(0,120)">
        <rect width="336" height="38" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
        <g transform="translate(10,10)"><rect width="26" height="12" rx="6" fill="#9E9E9E"/><text x="13" y="9" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">MAN</text></g>
        <text x="42" y="19" font-size="13" font-weight="700" fill="#212121">Chai thela (cash)</text>
        <text x="10" y="33" font-size="10" fill="#616161">18 Oct</text>
        <text x="326" y="19" font-size="13" font-weight="700" fill="#212121" text-anchor="end">₹30.00</text>
      </g>
      <g transform="translate(0,160)">
        <rect width="336" height="38" rx="10" fill="#FFFFFF" stroke="#E0E0E0"/>
        <g transform="translate(10,10)"><rect width="24" height="12" rx="6" fill="#26A69A"/><text x="12" y="9" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">SMS</text></g>
        <text x="40" y="19" font-size="13" font-weight="700" fill="#212121">UPI/Swiggy</text>
        <text x="10" y="33" font-size="10" fill="#616161">16 Oct · HDFC</text>
        <text x="326" y="19" font-size="13" font-weight="700" fill="#212121" text-anchor="end">₹342.00</text>
      </g>
    </g>

    <!-- Bottom nav bar — pinned -->
    <rect y="708" width="360" height="2" fill="#E0E0E0"/>
    <rect y="710" width="360" height="70" fill="#FFFFFF"/>

    <g transform="translate(0,718)" font-size="10" font-weight="700" fill="#616161" letter-spacing="0.4">
      <!-- Slot 1: Home (active) -->
      <g transform="translate(36,0)">
        <!-- icon: house -->
        <g stroke="#1976D2" stroke-width="2" fill="none" stroke-linejoin="round">
          <path d="M-10,8 L0,-2 L10,8 L10,18 L-10,18 Z"/>
        </g>
        <text y="36" fill="#1976D2" text-anchor="middle">Home</text>
      </g>

      <!-- Slot 2: Expenses -->
      <g transform="translate(108,0)">
        <!-- icon: list bars -->
        <g stroke="#9E9E9E" stroke-width="2" stroke-linecap="round">
          <line x1="-10" y1="2" x2="10" y2="2"/>
          <line x1="-10" y1="8" x2="10" y2="8"/>
          <line x1="-10" y1="14" x2="4"  y2="14"/>
        </g>
        <text y="36" fill="#9E9E9E" text-anchor="middle">Expenses</text>
      </g>

      <!-- Slot 3: + (prominent filled square) -->
      <g transform="translate(180,-10)">
        <rect x="-22" y="-6" width="44" height="44" rx="12" fill="#1976D2"/>
        <text x="0" y="24" font-size="24" font-weight="500" fill="#FFFFFF" text-anchor="middle">+</text>
      </g>

      <!-- Slot 4: Trips -->
      <g transform="translate(252,0)">
        <!-- icon: paper plane / briefcase -->
        <g stroke="#9E9E9E" stroke-width="2" fill="none" stroke-linejoin="round">
          <path d="M-10,-2 L10,8 L-10,18 L-6,8 Z"/>
        </g>
        <text y="36" fill="#9E9E9E" text-anchor="middle">Trips</text>
      </g>

      <!-- Slot 5: More -->
      <g transform="translate(324,0)">
        <!-- icon: hamburger / horizontal lines -->
        <g stroke="#9E9E9E" stroke-width="2" stroke-linecap="round">
          <line x1="-10" y1="2" x2="10" y2="2"/>
          <line x1="-10" y1="9" x2="10" y2="9"/>
          <line x1="-10" y1="16" x2="10" y2="16"/>
        </g>
        <text y="36" fill="#9E9E9E" text-anchor="middle">More</text>
      </g>
    </g>

    <!-- Caption below the frame -->
    <text x="180" y="800" font-size="10" font-weight="700" fill="#1565C0" text-anchor="middle" letter-spacing="1.2">05 · DASHBOARD WITH BOTTOM NAV</text>
  </g>
</svg>
