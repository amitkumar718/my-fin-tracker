<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="Roboto, 'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="820" fill="#ECEFF1"/>

  <text x="40" y="40" font-size="20" font-weight="500" fill="#212121">Settings — before &amp; after</text>

  <!-- BEFORE (left phone) -->
  <text x="80" y="76" font-size="11" font-weight="700" fill="#9E9E9E" letter-spacing="1.4">BEFORE</text>
  <g transform="translate(80,88)">
    <rect width="360" height="700" rx="24" fill="#F5F5F5" stroke="#CFD8DC"/>
    <!-- status bar -->
    <rect y="0" width="360" height="28" rx="24" fill="#1976D2"/>
    <rect y="12" width="360" height="16" fill="#1976D2"/>
    <!-- action bar -->
    <rect y="28" width="360" height="48" fill="#1976D2"/>
    <text x="20" y="58" font-size="16" fill="#FFFFFF" font-weight="500">Settings</text>

    <!-- landing page block -->
    <g transform="translate(20,96)">
      <text y="12" font-size="12" fill="#616161">Landing page</text>
      <rect y="22" width="320" height="46" rx="4" fill="#FFFFFF" stroke="#CFD8DC"/>
      <text x="12" y="50" font-size="14" fill="#212121">Expenses</text>
      <polygon points="300,42 312,42 306,50" fill="#9E9E9E"/>
    </g>

    <!-- row banks -->
    <g transform="translate(20,172)">
      <rect width="320" height="76" rx="4" fill="#FFFFFF"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#212121">Banks &amp; Patterns</text>
      <text x="16" y="52" font-size="12" fill="#757575">3 banks configured</text>
      <text x="296" y="48" font-size="22" fill="#BDBDBD" text-anchor="end">›</text>
    </g>
    <!-- row dropbox -->
    <g transform="translate(20,260)">
      <rect width="320" height="76" rx="4" fill="#FFFFFF"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#212121">Dropbox</text>
      <text x="16" y="52" font-size="12" fill="#388E3C">Token set</text>
      <text x="296" y="48" font-size="22" fill="#BDBDBD" text-anchor="end">›</text>
    </g>
    <!-- row debug -->
    <g transform="translate(20,348)">
      <rect width="320" height="76" rx="4" fill="#FFFFFF"/>
      <text x="16" y="30" font-size="15" font-weight="700" fill="#212121">Debug</text>
      <text x="16" y="52" font-size="12" fill="#757575">Patterns and orphan transactions</text>
      <text x="296" y="48" font-size="22" fill="#BDBDBD" text-anchor="end">›</text>
    </g>
  </g>

  <!-- AFTER (right phone) -->
  <text x="470" y="76" font-size="11" font-weight="700" fill="#1976D2" letter-spacing="1.4">AFTER</text>
  <g transform="translate(470,88)">
    <rect width="360" height="700" rx="24" fill="#F5F7FA" stroke="#CFD8DC"/>
    <!-- status bar -->
    <rect y="0" width="360" height="28" rx="24" fill="#1565C0"/>
    <rect y="12" width="360" height="16" fill="#1565C0"/>
    <!-- top app bar w/ elevation shadow -->
    <rect y="28" width="360" height="52" fill="#FFFFFF"/>
    <rect y="78" width="360" height="2" fill="#E0E0E0"/>
    <text x="20" y="60" font-size="20" font-weight="500" fill="#212121">Settings</text>

    <!-- Section: APPEARANCE -->
    <text x="20" y="108" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">APPEARANCE</text>
    <g transform="translate(16,118)">
      <rect width="328" height="60" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="16" y="26" font-size="13" fill="#616161">Landing page</text>
      <text x="16" y="48" font-size="15" font-weight="500" fill="#212121">Expenses</text>
      <text x="312" y="42" font-size="18" fill="#9E9E9E" text-anchor="end">▾</text>
    </g>

    <!-- Section: DATA -->
    <text x="20" y="208" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">DATA</text>
    <!-- row banks -->
    <g transform="translate(16,218)">
      <rect width="328" height="64" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
      <!-- leading icon circle -->
      <circle cx="28" cy="32" r="18" fill="#E3F2FD"/>
      <text x="28" y="37" font-size="14" fill="#1976D2" text-anchor="middle">🏦</text>
      <text x="56" y="28" font-size="15" font-weight="500" fill="#212121">Banks &amp; Patterns</text>
      <text x="56" y="48" font-size="12" fill="#616161">3 banks configured</text>
      <text x="310" y="40" font-size="22" fill="#BDBDBD" text-anchor="end">›</text>
    </g>
    <!-- row dropbox -->
    <g transform="translate(16,290)">
      <rect width="328" height="64" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
      <circle cx="28" cy="32" r="18" fill="#E0F2F1"/>
      <text x="28" y="37" font-size="14" fill="#00695C" text-anchor="middle">◫</text>
      <text x="56" y="28" font-size="15" font-weight="500" fill="#212121">Dropbox</text>
      <text x="56" y="48" font-size="12" fill="#388E3C">Token set</text>
      <text x="310" y="40" font-size="22" fill="#BDBDBD" text-anchor="end">›</text>
    </g>

    <!-- Section: ADVANCED -->
    <text x="20" y="384" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">ADVANCED</text>
    <g transform="translate(16,394)">
      <rect width="328" height="64" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
      <circle cx="28" cy="32" r="18" fill="#FFF3E0"/>
      <text x="28" y="37" font-size="14" fill="#EF6C00" text-anchor="middle">⚙</text>
      <text x="56" y="28" font-size="15" font-weight="500" fill="#212121">Debug</text>
      <text x="56" y="48" font-size="12" fill="#616161">Patterns and orphan transactions</text>
      <text x="310" y="40" font-size="22" fill="#BDBDBD" text-anchor="end">›</text>
    </g>
  </g>
</svg>
