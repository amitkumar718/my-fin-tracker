<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="Roboto, 'Segoe UI', system-ui, sans-serif">
  <rect width="900" height="820" fill="#F5F7FA"/>

  <!-- Title -->
  <text x="40" y="52" font-size="24" font-weight="500" fill="#212121">my-fin-tracker · proposed palette &amp; components</text>
  <text x="40" y="76" font-size="13" fill="#616161">Works within Termux/D8 constraints — no AndroidX, no Material lib.</text>

  <!-- Palette -->
  <text x="40" y="118" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">PALETTE</text>
  <g font-size="11" fill="#FFFFFF">
    <g transform="translate(40,132)">
      <rect width="110" height="56" rx="8" fill="#1976D2"/><text x="10" y="22">primary</text><text x="10" y="42" opacity="0.85">#1976D2</text>
    </g>
    <g transform="translate(160,132)">
      <rect width="110" height="56" rx="8" fill="#1565C0"/><text x="10" y="22">primary dark</text><text x="10" y="42" opacity="0.85">#1565C0</text>
    </g>
    <g transform="translate(280,132)">
      <rect width="110" height="56" rx="8" fill="#26A69A"/><text x="10" y="22">accent (sms/credit hint)</text><text x="10" y="42" opacity="0.85">#26A69A</text>
    </g>
    <g transform="translate(400,132)">
      <rect width="110" height="56" rx="8" fill="#2E7D32"/><text x="10" y="22">credit</text><text x="10" y="42" opacity="0.85">#2E7D32</text>
    </g>
    <g transform="translate(520,132)">
      <rect width="110" height="56" rx="8" fill="#C62828"/><text x="10" y="22">debit</text><text x="10" y="42" opacity="0.85">#C62828</text>
    </g>
    <g transform="translate(640,132)">
      <rect width="110" height="56" rx="8" fill="#D32F2F"/><text x="10" y="22">error / destructive</text><text x="10" y="42" opacity="0.85">#D32F2F</text>
    </g>
    <g transform="translate(760,132)">
      <rect width="110" height="56" rx="8" fill="#6A1B9A"/><text x="10" y="22">amount (auto)</text><text x="10" y="42" opacity="0.85">#6A1B9A</text>
    </g>
  </g>
  <g font-size="11">
    <g transform="translate(40,196)">
      <rect width="110" height="56" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="10" y="22" fill="#212121">surface</text><text x="10" y="42" fill="#616161">#FFFFFF</text>
    </g>
    <g transform="translate(160,196)">
      <rect width="110" height="56" rx="8" fill="#F5F7FA" stroke="#E0E0E0"/>
      <text x="10" y="22" fill="#212121">background</text><text x="10" y="42" fill="#616161">#F5F7FA</text>
    </g>
    <g transform="translate(280,196)">
      <rect width="110" height="56" rx="8" fill="#212121"/>
      <text x="10" y="22" fill="#FFFFFF">text / strong</text><text x="10" y="42" fill="#BDBDBD">#212121</text>
    </g>
    <g transform="translate(400,196)">
      <rect width="110" height="56" rx="8" fill="#616161"/>
      <text x="10" y="22" fill="#FFFFFF">text / body</text><text x="10" y="42" fill="#E0E0E0">#616161</text>
    </g>
    <g transform="translate(520,196)">
      <rect width="110" height="56" rx="8" fill="#9E9E9E"/>
      <text x="10" y="22" fill="#FFFFFF">text / muted</text><text x="10" y="42" fill="#F5F5F5">#9E9E9E</text>
    </g>
    <g transform="translate(640,196)">
      <rect width="110" height="56" rx="8" fill="#FFFFFF" stroke="#E0E0E0"/>
      <text x="10" y="22" fill="#212121">hairline</text><text x="10" y="42" fill="#616161">#E0E0E0</text>
    </g>
    <g transform="translate(760,196)">
      <rect width="110" height="56" rx="8" fill="#F8E9A1" stroke="#E0E0E0"/>
      <text x="10" y="22" fill="#5D4037">warning tint</text><text x="10" y="42" fill="#5D4037">#F8E9A1</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="40" y="296" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">TYPOGRAPHY</text>
  <g transform="translate(40,316)">
    <text y="22" font-size="20" font-weight="500" fill="#212121">Title · 20sp / medium</text>
    <text y="22" x="340" font-size="12" fill="#9E9E9E">TextAppearance.Title</text>
    <text y="48" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.6">SECTION HEADER · 11SP / BOLD / +0.06</text>
    <text y="48" x="340" font-size="12" fill="#9E9E9E">TextAppearance.Section</text>
    <text y="76" font-size="15" fill="#212121">Body · 15sp</text>
    <text y="76" x="340" font-size="12" fill="#9E9E9E">TextAppearance.Body</text>
    <text y="104" font-size="15" font-weight="500" fill="#212121">Body strong · 15sp / medium</text>
    <text y="104" x="340" font-size="12" fill="#9E9E9E">TextAppearance.BodyStrong</text>
    <text y="128" font-size="12" fill="#616161">Caption · 12sp</text>
    <text y="128" x="340" font-size="12" fill="#9E9E9E">TextAppearance.Caption</text>
    <text y="152" font-size="13" fill="#37474F" font-family="monospace">Mono · 13sp (templates, regex)</text>
    <text y="152" x="340" font-size="12" fill="#9E9E9E">TextAppearance.Mono</text>
  </g>

  <!-- Components -->
  <text x="480" y="296" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">BUTTONS · 3 ROLES</text>
  <g transform="translate(480,316)">
    <rect width="140" height="40" rx="8" fill="#1976D2"/>
    <text x="70" y="26" font-size="13" font-weight="500" fill="#FFFFFF" text-anchor="middle">Primary</text>
    <text x="0" y="60" font-size="11" fill="#9E9E9E">filled · CTA</text>

    <g transform="translate(160,0)">
      <rect width="140" height="40" rx="8" fill="#FFFFFF" stroke="#1976D2"/>
      <text x="70" y="26" font-size="13" font-weight="500" fill="#1976D2" text-anchor="middle">Secondary</text>
      <text x="0" y="60" font-size="11" fill="#9E9E9E">tonal / outlined</text>
    </g>

    <g transform="translate(320,0)">
      <rect width="140" height="40" rx="8" fill="#FFFFFF"/>
      <text x="70" y="26" font-size="13" font-weight="500" fill="#D32F2F" text-anchor="middle">Delete</text>
      <text x="0" y="60" font-size="11" fill="#9E9E9E">text · destructive</text>
    </g>
  </g>

  <text x="480" y="396" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">BADGES</text>
  <g transform="translate(480,416)">
    <rect width="54" height="22" rx="11" fill="#1976D2"/>
    <text x="27" y="15" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">PDF</text>

    <g transform="translate(64,0)">
      <rect width="54" height="22" rx="11" fill="#26A69A"/>
      <text x="27" y="15" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">SMS</text>
    </g>
    <g transform="translate(128,0)">
      <rect width="74" height="22" rx="11" fill="#D32F2F"/>
      <text x="37" y="15" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">ORPHAN</text>
    </g>
    <g transform="translate(212,0)">
      <rect width="66" height="22" rx="11" fill="#2E7D32"/>
      <text x="33" y="15" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">CREDIT</text>
    </g>
    <g transform="translate(288,0)">
      <rect width="56" height="22" rx="11" fill="#C62828"/>
      <text x="28" y="15" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.6">DEBIT</text>
    </g>
  </g>

  <text x="480" y="482" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">CARD ROW · 12DP RADIUS, 1DP HAIRLINE OR 2DP ELEVATION</text>
  <g transform="translate(480,500)">
    <rect width="380" height="66" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
    <text x="16" y="30" font-size="15" font-weight="500" fill="#212121">HDFC Bank</text>
    <text x="16" y="52" font-size="12" fill="#616161">3 PDF patterns · 2 SMS patterns</text>
    <text x="360" y="42" font-size="22" fill="#9E9E9E" text-anchor="end">›</text>
  </g>

  <text x="480" y="596" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">CHIPS (TRANS TEMPLATE)</text>
  <g transform="translate(480,614)" font-size="11" font-weight="500" fill="#FFFFFF">
    <rect width="68" height="28" rx="14" fill="#6A1B9A"/>
    <text x="34" y="18" text-anchor="middle">Amount</text>

    <g transform="translate(78,0)">
      <rect width="58" height="28" rx="14" fill="#C62828"/>
      <text x="29" y="18" text-anchor="middle">Amt Db</text>
    </g>
    <g transform="translate(146,0)">
      <rect width="58" height="28" rx="14" fill="#2E7D32"/>
      <text x="29" y="18" text-anchor="middle">Amt Cr</text>
    </g>
    <g transform="translate(214,0)">
      <rect width="52" height="28" rx="14" fill="#56B4E9"/>
      <text x="26" y="18" text-anchor="middle">Bal</text>
    </g>
    <g transform="translate(276,0)">
      <rect width="60" height="28" rx="14" fill="#D55E00"/>
      <text x="30" y="18" text-anchor="middle">Date</text>
    </g>
  </g>

  <text x="40" y="520" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">SHAPE &amp; SPACING</text>
  <g transform="translate(40,540)" font-size="12" fill="#616161">
    <text y="18">corner · card 12dp  ·  button 8dp  ·  chip 14dp (full)</text>
    <text y="42">spacing · 4 · 8 · 12 · 16 · 24 (dimens.xml)</text>
    <text y="66">elevation · card 1dp  ·  app bar 4dp  ·  dialog 8dp</text>
    <text y="90">hairline · 1dp #E0E0E0 (preferred over elevation on long lists)</text>
  </g>

  <text x="40" y="680" font-size="11" font-weight="700" fill="#616161" letter-spacing="1.5">EMPTY STATE</text>
  <g transform="translate(40,698)">
    <rect width="400" height="100" rx="12" fill="#FFFFFF" stroke="#E0E0E0"/>
    <circle cx="56" cy="50" r="22" fill="#F5F7FA" stroke="#E0E0E0"/>
    <text x="56" y="56" font-size="20" fill="#9E9E9E" text-anchor="middle">∅</text>
    <text x="92" y="42" font-size="14" font-weight="500" fill="#212121">No patterns yet</text>
    <text x="92" y="62" font-size="12" fill="#616161">Add one from a bank's config screen.</text>
  </g>
</svg>
