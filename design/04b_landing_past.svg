<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 900" font-family="Roboto, 'Segoe UI', system-ui, sans-serif">
  <rect width="480" height="900" fill="#ECEFF1"/>

  <g transform="translate(60,20)">
    <rect width="360" height="860" rx="28" fill="#F5F7FA" stroke="#CFD8DC"/>

    <rect y="0" width="360" height="28" rx="28" fill="#1565C0"/>
    <rect y="12" width="360" height="16" fill="#1565C0"/>

    <!-- Top app bar -->
    <rect y="28" width="360" height="56" fill="#FFFFFF"/>
    <rect y="82" width="360" height="2" fill="#E0E0E0"/>
    <text x="20" y="62" font-size="20" font-weight="500" fill="#212121">my-fin-tracker</text>
    <g transform="translate(324,42)">
      <circle cx="12" cy="12" r="4" fill="none" stroke="#616161" stroke-width="2"/>
      <g stroke="#616161" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/>
        <line x1="5" y1="5" x2="8" y2="8"/><line x1="16" y1="16" x2="19" y2="19"/>
        <line x1="5" y1="19" x2="8" y2="16"/><line x1="16" y1="8" x2="19" y2="5"/>
