      <g transform="translate(252,0)">
        <rect width="76" height="78" rx="14" fill="#FFFFFF" stroke="#E0E0E0"/>
        <circle cx="38" cy="30" r="18" fill="#F3E5F5"/>
        <text x="38" y="36" font-size="16" fill="#6A1B9A" text-anchor="middle">✈</text>
